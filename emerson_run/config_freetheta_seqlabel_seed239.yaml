model_config:
  encoder_type: "transformer"
  encoder_params:
    max_sequence_length: null   # filled in from the data
    alphabet_length: null       # filled in from the data
    attention_dim: 64
    attention_dim_head: 32      # x_transformers wants >= 32 for rotary embeddings
    attention_heads: 8
    depth: 4
    use_positional_encodings: true
    # "mean_max" pools over positions with the padding mask applied, so the latent
    # no longer depends on where in the padded window a residue happens to sit.
    pooling: "mean_max"
    mask_padding: true
  decoder_type: "transformer"
  decoder_params:
    max_sequence_length: null
    alphabet_length: null
    attention_dim: 64
    attention_dim_head: 32
    attention_heads: 8
    depth: 4
    use_positional_encodings: true
  airrtm_params:
    n_repertoires: null         # filled in from the data
    latent_dim: 64
    n_topics_signal: 10
    n_topics_nonsignal: 20
    # "amortized" infers topic proportions from a sample of the repertoire's own
    # sequences, so held-out repertoires can be scored at all. "free" reproduces the
    # original per-repertoire embedding (training repertoires only); "both" uses the
    # free row as a residual on top of the amortized logits.
    theta_mode: "free"
    # attention pooling + label_input=repertoire is the only combination that has
    # ever moved the label branch off chance on Emerson (FINDINGS.md finding 1).
    theta_pooling: "attention"
    label_input: "sequence"
    vj_embedding_dim: 16

data_config:
  use_vj: true
  # Draw sequences in proportion to duplicate_count: clonal expansion is signal.
  abundance_weighted_sampling: true

training_config:
  # NO-WARM-START, EXTENDED (PLAN_v5 stage 0 follow-up, 2026-09-17). The 60-epoch
  # `normloss_nowarm` curve rose steadily from epoch 38 (0.734) to 0.7666 at epoch 58
  # and was STILL CLIMBING when its budget ran out -- the highest held-out AUC this
  # project has recorded, and unlike `normloss_tm03` (which spiked to 0.762 at epoch 22
  # then decayed) it shows no sign of turning over. Extended to 200 epochs to find where
  # it actually plateaus. checkpoint_every 2 -> 5 keeps the curve to 40 points.
  log_dir_suffix: "logs"
  device: "cuda:2"
  seed: 239
  n_epochs: 80
  patience: 80
  val_size: 0.1
  learning_rate: 0.0003
  weight_decay: 0.0
  lr_decay_gamma: null
  grad_clip: 1.0
  # Bag size: at 1024, most CMV+ repertoires' 8192-sequence sample contains no
  # discriminative clonotype at all (FINDINGS.md hardware note); 8192 gets ~83%
  # coverage. Kept at 4 repertoires/step to stay under 80GB (~2.1GB/1024 seqs fp32).
  n_sequences_per_repertoire_in_batch: 8192
  n_repertoires_in_batch: 4
  min_repertoire_size: 32768
  # Sequences are sampled with replacement, so epoch length is a free choice. With
  # 597 repertoires an uncapped epoch is ~2300 steps; 4 keeps it near 300 so
  # validation, checkpoints and early stopping happen at a watchable cadence.
  n_batches_per_repertoire: 4
  n_batches_per_repertoire_val: 1
  log_every: 20
  checkpoint_every: 2
  # MIL pooling temperature: tau -> 0 pools the per-sequence label logits towards
  # their mean, tau -> inf towards their max. Annealing up starts from the stable
  # mean and sharpens onto individual signal sequences.
  tau: 1.0
  tau_start: 0.1
  # Warm-start schedule (see FINDINGS.md 2026-09-09): TM likelihood gets an
  # unopposed window before the label loss and entropy regularisers are
  # introduced, to test whether competition (not just step count) is what
  # keeps tm flat in the configs that actually generalise.
  loss_config:
    # NORMALISED-LOSS ARM (PLAN_v4, 2026-09-16). normalize_loss_scales divides each
    # term by its own chance value (rec ln21=3.04, tm ln32768=10.40, label
    # 0.5*ln2=0.35, entropies ln n_topics) before the weighted sum, so a coefficient
    # finally means what it looks like. Side effect to keep in mind when reading
    # these: it divides tm's gradient by 10.4 and multiplies the label's by 2.9,
    # moving the label:tm gradient ratio from 0.43 to ~12.8 at unchanged
    # coefficients -- so tm_likelihood_coef does NOT carry over from the
    # un-normalised runs and is the axis swept here.
    # This arm: Label-heavy: tm is the term that never moves, so starve it.
    normalize_loss_scales: true
    # total = vae_coef * (rec_coef * rec + (1 - rec_coef) * kl)
    #       + (1 - vae_coef) * (tm_coef * tm + (1 - tm_coef) * label)
    #       + the regularisers below.
    vae_coef: 0.05
    reconstruction_loss_coef: 0.95
    # Non-zero again now that the TM likelihood is normalised over the batch; with
    # tm_likelihood_coef: 0.0 the model degenerates to plain noisy-label MIL.
    # FREE THETA + PER-SEQUENCE LABEL (2026-09-18). Theta becomes a per-repertoire
    # lookup with no sequence input, so the only way to fit
    # p(s|r) = sum_t theta_rt exp(phi_ts) is to make PHI sequence-discriminative --
    # phi being the pathway stuck at 0.86-1.09x chance on every checkpoint ever
    # scored. With amortized Theta the TM term can be satisfied by moving Theta
    # instead, and the two are coupled through the shared trunk (see AIRRTM_Model.
    # forward's docstring: "the TM term ends up fighting itself").
    #
    # label_input="sequence" (not "repertoire") means the label loss ALSO pushes on
    # phi, and the MIL smooth-max over the bag becomes live instead of an identity.
    # It is also what keeps this legal: the guard only rejects free + repertoire.
    #
    # Precedent: budget_t60_reps597 was free-Theta and reached 0.023 nats of tm gain,
    # 10x any amortized run -- but had no label loss, so phi never learned which
    # topics were signal. This is that run plus a label loss.
    tm_likelihood_coef: 0.3
    positive_class_weight: 0.5
    topic_l1_coef: 0.0
    # The two entropy terms are a pair (FINDINGS.md finding 5): theta_entropy_coef
    # alone collapses Theta onto ~2 topics; topic_usage_coef alone drives it uniform.
    # Together the target signature is H_theta falling while H_usage holds near
    # log(n_topics).
    #
    # topic_usage_coef is 5x the shipped 1.0: composite_loss._topic_usage()'s EMA
    # (smoothed_T = momentum * theta_bar.detach() + (1-momentum) * batch_mean_T) only
    # passes gradient through the (1-momentum) branch, so a raw coef of 1.0 has an
    # effective weight of 1.0*(1-0.9)=0.1 -- 5x *weaker* than theta_entropy_coef, not
    # 2x stronger as intended. Every run launched with coef 1.0 collapsed H_theta and
    # H_usage to ~0 by epoch 0. 5.0 (effective 0.5, a 1:1 footing with
    # theta_entropy_coef) was chosen from a smoke test: 10.0 (the naive "undo the
    # attenuation" fix, effective 1.0) overshot into the *other* failure mode from
    # finding 5 instead -- both entropies pinned near log(n_topics), i.e. uniform
    # Theta everywhere. 5.0 was the first value where H_theta fell while H_usage
    # stayed contested rather than saturating either way. Still only checked on a
    # 64-repertoire slice for a few epochs -- watch H_usage on the real run and
    # raise/lower this if it drifts back to either extreme.
    theta_entropy_coef: 0.5
    topic_usage_coef: 5.0
    topic_usage_momentum: 0.9
    topic_decorrelation_coef: 0.0
    # Cap the in-batch negative pool for the TM partition function; null uses the
    # whole batch (n_repertoires_in_batch * n_sequences_per_repertoire_in_batch).
    tm_max_negatives: null
