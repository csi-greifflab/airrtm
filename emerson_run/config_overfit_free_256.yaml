model_config:
  encoder_type: "transformer"
  encoder_params:
    max_sequence_length: null   # filled in from the data
    alphabet_length: null       # filled in from the data
    attention_dim: 64
    attention_dim_head: 32      # x_transformers wants >= 32 for rotary embeddings
    attention_heads: 8
    depth: 4
    use_positional_encodings: true
    # "mean_max" pools over positions with the padding mask applied, so the latent
    # no longer depends on where in the padded window a residue happens to sit.
    pooling: "mean_max"
    mask_padding: true
  decoder_type: "transformer"
  decoder_params:
    max_sequence_length: null
    alphabet_length: null
    attention_dim: 64
    attention_dim_head: 32
    attention_heads: 8
    depth: 4
    use_positional_encodings: true
  airrtm_params:
    n_repertoires: null         # filled in from the data
    latent_dim: 64
    n_topics_signal: 10
    n_topics_nonsignal: 20
    # "amortized" infers topic proportions from a sample of the repertoire's own
    # sequences, so held-out repertoires can be scored at all. "free" reproduces the
    # original per-repertoire embedding (training repertoires only); "both" uses the
    # free row as a residual on top of the amortized logits.
    theta_mode: "free"
    vj_embedding_dim: 16

data_config:
  use_vj: true
  # Draw sequences in proportion to duplicate_count: clonal expansion is signal.
  abundance_weighted_sampling: true

training_config:
  log_dir_suffix: "logs"
  device: "cuda:0"
  seed: 239
  n_epochs: 100
  patience: 40
  val_size: 0.1
  learning_rate: 0.0003
  weight_decay: 0.0
  lr_decay_gamma: null
  grad_clip: 1.0
  # Bag size: at 1024, most CMV+ repertoires' 8192-sequence sample contains no
  # discriminative clonotype at all (FINDINGS.md hardware note); 8192 gets ~83%
  # coverage. Kept at 4 repertoires/step to stay under 80GB (~2.1GB/1024 seqs fp32).
  n_sequences_per_repertoire_in_batch: 8192
  n_repertoires_in_batch: 4
  min_repertoire_size: 32768
  # Repertoire-count scaling sweep (FINDINGS.md "can the TM likelihood be fit at
  # all?"): identical recipe to config_overfit_free_16_fixed.yaml /
  # config_overfit_free_full.yaml, run at an intermediate repertoire count via
  # `--repertoire_slice 0:256`. n_batches_per_repertoire is re-derived so
  # steps/epoch (= n_batches_per_repertoire * groups, groups = 256 // 4 = 64)
  # holds at ~200, matching the 16-repertoire run rather than reusing its value
  # verbatim.
  n_batches_per_repertoire: 3
  n_batches_per_repertoire_val: 1
  log_every: 20
  checkpoint_every: 5
  # MIL pooling temperature: tau -> 0 pools the per-sequence label logits towards
  # their mean, tau -> inf towards their max. Annealing up starts from the stable
  # mean and sharpens onto individual signal sequences.
  tau: 1.0
  tau_start: 0.1
  loss_config:
    # total = vae_coef * (rec_coef * rec + (1 - rec_coef) * kl)
    #       + (1 - vae_coef) * (tm_coef * tm + (1 - tm_coef) * label)
    #       + the regularisers below.
    vae_coef: 0.05
    reconstruction_loss_coef: 0.95
    # Non-zero again now that the TM likelihood is normalised over the batch; with
    # tm_likelihood_coef: 0.0 the model degenerates to plain noisy-label MIL.
    # Diagnostic: can the TM likelihood be minimized at all, unopposed? Every
    # competing term zeroed, label loss starved (tm_likelihood_coef essentially 1.0),
    # so this measures the TM objective's own learnability, not its ability to win a
    # fight against the label/entropy terms.
    tm_likelihood_coef: 1.0
    positive_class_weight: 0.5
    topic_l1_coef: 0.0
    theta_entropy_coef: 0.0
    topic_usage_coef: 0.0
    topic_decorrelation_coef: 0.0
    # Cap the in-batch negative pool for the TM partition function; null uses the
    # whole batch (n_repertoires_in_batch * n_sequences_per_repertoire_in_batch).
    tm_max_negatives: null
